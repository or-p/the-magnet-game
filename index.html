<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧲 لعبة المغناطيس</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #050510 100%);
    color: #e8e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 12px; overflow-x: hidden;
  }
  .screen { display: none; width: 100%; max-width: 560px; flex-direction: column; align-items: center; gap: 14px; }
  .screen.active { display: flex; }
  h1 {
    font-size: 34px; margin: 20px 0 4px; text-align: center;
    background: linear-gradient(135deg, #ff4466, #ffaa44, #44ff88, #4488ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; filter: drop-shadow(0 4px 12px rgba(100,180,255,0.3));
  }
  .subtitle { color: rgba(200,220,255,0.6); font-size: 14px; margin-bottom: 8px; text-align: center; line-height: 1.6; }
  button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; padding: 15px 28px; border-radius: 14px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    width: 100%; max-width: 320px; transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(102,126,234,0.4); font-family: inherit;
  }
  button:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(102,126,234,0.6); }
  button.secondary { background: linear-gradient(135deg, #2a2a3e, #1a1a2e); border: 2px solid rgba(100,180,255,0.3); }
  input {
    width: 100%; max-width: 320px; padding: 15px; border-radius: 12px;
    border: 2px solid rgba(100,180,255,0.4); background: rgba(255,255,255,0.05);
    color: #fff; font-size: 22px; text-align: center;
    letter-spacing: 6px; text-transform: uppercase; font-weight: 700;
    font-family: monospace; transition: all 0.2s;
  }
  input:focus { outline: none; border-color: #66b3ff; box-shadow: 0 0 20px rgba(102,179,255,0.3); }
  input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: normal; text-transform: none; font-weight: 360; font-size: 15px; }
  .divider { color: rgba(200,220,255,0.35); font-size: 13px; margin: 4px 0; }
  #status, #status2 { color: rgba(200,220,255,0.7); font-size: 14px; text-align: center; min-height: 20px; }
  #roomCodeBig {
    font-size: 52px; font-weight: 900; letter-spacing: 10px;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    padding: 24px 32px; border-radius: 16px;
    border: 2px dashed rgba(255,215,0,0.5);
    background-color: rgba(255,215,0,0.05);
    font-family: monospace; filter: drop-shadow(0 4px 12px rgba(255,215,0,0.3));
  }
  .spinner {
    width: 44px; height: 44px; border: 4px solid rgba(100,180,255,0.15);
    border-top-color: #66b3ff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #gameScreen { max-width: 100%; }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(100,180,255,0.15);
    width: min(92vw, 55vh, 540px);
    font-size: 15px; font-weight: 700;
    backdrop-filter: blur(8px);
  }
  .hud .side { display: flex; align-items: center; gap: 8px; }
  .hud .count {
    background: rgba(100,180,255,0.2); padding: 4px 10px; border-radius: 8px;
    font-family: monospace; font-size: 16px;
  }
  .hud.myTurn { border-color: rgba(68,255,136,0.6); box-shadow: 0 0 20px rgba(68,255,136,0.2); }
  .hud.win { background: rgba(68,255,136,0.15); border-color: rgba(68,255,136,0.6); }
  .hud.lose { background: rgba(255,68,102,0.15); border-color: rgba(255,68,102,0.6); }
  .turn-indicator { font-size: 13px; font-weight: 600; color: #44ff88; }
  .hud-top { margin-bottom: 4px; }
  .hud-bottom { margin-top: 4px; }
  #board {
    width: min(92vw, 55vh, 360px); height: min(92vw, 55vh, 360px);
    display: block; border-radius: 16px; touch-action: none; cursor: crosshair;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 80px rgba(255,180,80,0.08);
  }
  #newGameBtn { display: none; margin-top: 8px; }
  .win-badge { display: inline-block; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .magnet-icon { display: inline-block; width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; }
  /* تحديث أيقونات الـ HUD لتكون كرات سوداء */
  .magnet-icon.red { background: radial-gradient(circle at 30% 30%, #555, #000); box-shadow: inset -2px -2px 6px rgba(255,50,50,0.8), 0 0 8px rgba(255,50,50,0.4); }
  .magnet-icon.blue { background: radial-gradient(circle at 30% 30%, #555, #000); box-shadow: inset -2px -2px 6px rgba(50,150,255,0.8), 0 0 8px rgba(50,150,255,0.4); }
</style>
</head>
<body>

<div id="lobbyScreen" class="screen active">
  <h1>🧲 لعبة المغناطيس</h1>
  <p class="subtitle">كل لاعب عنده 10 قطع<br>حط قطعة كل دور — إذا قربت من غيرها تنجذب وتاخدها<br>أول واحد يخلص قطعه يفوز 🏆</p>
  <button onclick="createRoom()">🎮 إنشاء غرفة جديدة</button>
  <div class="divider">— أو انضم لغرفة موجودة —</div>
  <input id="roomInput" placeholder="أدخل رمز الغرفة" maxlength="6" autocomplete="off">
  <button onclick="joinRoom()" class="secondary">🔗 انضمام</button>
  <div id="status"></div>
</div>

<div id="waitingScreen" class="screen">
  <h2 style="font-size:20px;margin:8px 0">📤 شارك هذا الرمز مع صديقك</h2>
  <div id="roomCodeBig">------</div>
  <button onclick="copyCode()" class="secondary" style="max-width:220px;font-size:15px">📋 نسخ الرمز</button>
  <div class="spinner"></div>
  <p style="margin:0">في انتظار انضمام صديقك...</p>
  <div id="status2"></div>
</div>

<div id="gameScreen" class="screen">
  <div id="topHud" class="hud hud-top"></div>
  <canvas id="board" width="360" height="360"></canvas>
  <div id="bottomHud" class="hud hud-bottom"></div>
  <button id="newGameBtn" onclick="requestNewGame()">🔄 لعب مرة أخرى</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
const BOARD = 360; // تصغير اللوحة من 600 إلى 360
const PIECE_R = 16; // تصغير حجم الكرة قليلاً
const MAGNET_R = 68; // مجال الجذب
const PLACE_MIN = PIECE_R * 2.1;
const START_PIECES = 10;
const PREFIX = 'mcg5-'; // غيرت البادئة لضمان عدم تعارض الغرف

let canvas, ctx;
let myRole = null, peer = null, conn = null, roomCode = null;
let gameState = null;
let hoverPos = null;
let animations = [], pulses = [], confetti = [], arcs = [];
let renderLoopActive = false;
let audioCtx = null;
let lastFrame = 0;
let screenShake = 0;
let boardTexture = null;

window.addEventListener('load', () => {
  canvas = document.getElementById('board');
  ctx = canvas.getContext('2d');
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerleave', () => { hoverPos = null; render(); });
  document.body.addEventListener('pointerdown', ensureAudio, { once: true });
  boardTexture = generateBoardTexture();
  render();
});

function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; } }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type='sine', vol=0.09) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const sfxPlace = () => playTone(620, 0.08, 'sine', 0.1);
const sfxAttract = () => {
  playTone(280, 0.12, 'sawtooth', 0.07);
  setTimeout(() => playTone(380, 0.12, 'sawtooth', 0.07), 70);
  setTimeout(() => playTone(480, 0.15, 'sawtooth', 0.07), 140);
};
const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'sine', 0.12), i * 110));
const sfxLose = () => [360, 350, 300, 200].forEach((f, i) => setTimeout(() => playTone(f, 0.35, 'sine', 0.11), i * 150));
const sfxError = () => playTone(180, 0.12, 'square', 0.08);

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function newGameState() {
  return { pieces: [], hostHand: START_PIECES, guestHand: START_PIECES, currentTurn: 'host', winner: null };
}
function getAttracted(placed, all, R) {
  const set = new Set([placed]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const p of all) {
      if (set.has(p)) continue;
      for (const a of set) {
        if (dist(p, a) < R) { set.add(p); changed = true; break; }
      }
    }
  }
  return set;
}
function checkPlacement(st, x, y) {
  if (st.winner) return { ok: false, reason: 'gameover' };
  if (x < PIECE_R || x > BOARD - PIECE_R || y < PIECE_R || y > BOARD - PIECE_R) return { ok: false, reason: 'out' };
  for (const p of st.pieces) if (dist({x, y}, p) < PLACE_MIN) return { ok: false, reason: 'tooClose' };
  return { ok: true };
}
function applyMove(st, player, x, y) {
  const check = checkPlacement(st, x, y);
  if (!check.ok) return check;
  const hand = player === 'host' ? st.hostHand : st.guestHand;
  if (hand <= 0) return { ok: false, reason: 'noPieces' };
  const placed = { x, y, owner: player };
  const tempPieces = [...st.pieces, placed];
  const attracted = getAttracted(placed, tempPieces, MAGNET_R);
  const result = { ok: true, placed: { x, y, owner: player }, attracted: [], won: false };
  if (attracted.size > 1) {
    result.attracted = [...attracted].filter(p => p !== placed).map(p => ({ x: p.x, y: p.y, owner: p.owner }));
    st.pieces = tempPieces.filter(p => !attracted.has(p));
    const change = attracted.size - 1;
    if (player === 'host') st.hostHand += change;
    else st.guestHand += change;
  } else {
    st.pieces = tempPieces;
    if (player === 'host') st.hostHand -= 1;
    else st.guestHand -= 1;
  }
  const newHand = player === 'host' ? st.hostHand : st.guestHand;
  if (newHand <= 0) { st.winner = player; result.won = true; }
  else st.currentTurn = player === 'host' ? 'guest' : 'host';
  return result;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setStatus(msg) {
  const s1 = document.getElementById('status'), s2 = document.getElementById('status2');
  if (s1) s1.textContent = msg;
  if (s2) s2.textContent = msg;
}
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function createRoom() {
  ensureAudio();
  setStatus('جاري إنشاء الغرفة...');
  roomCode = genCode(); myRole = 'host';
  peer = new Peer(PREFIX + roomCode, { debug: 0 });
  peer.on('open', () => {
    document.getElementById('roomCodeBig').textContent = roomCode;
    showScreen('waitingScreen'); setStatus('');
  });
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') { peer.destroy(); setTimeout(createRoom, 200); }
    else setStatus('خطأ: ' + err.type);
  });
  peer.on('connection', (c) => {
    if (conn) { try { c.close(); } catch(e){} return; }
    conn = c; setupConn();
  });
}
function joinRoom() {
  ensureAudio();
  const code = document.getElementById('roomInput').value.toUpperCase().trim();
  if (code.length !== 6) { setStatus('الرمز لازم 6 حروف'); return; }
  setStatus('جاري الاتصال...');
  myRole = 'guest';
  peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    setupConn();
    setTimeout(() => { if (conn && !conn.open) setStatus('تعذر الاتصال — تأكد من الرمز'); }, 10000);
  });
  peer.on('error', (err) => {
    if (err.type === 'peer-unavailable') setStatus('الغرفة غير موجودة');
    else setStatus('خطأ: ' + err.type);
  });
}
function setupConn() {
  conn.on('open', () => {
    setStatus('');
    if (myRole === 'host') {
      gameState = newGameState();
      conn.send({ type: 'start', state: gameState });
      showScreen('gameScreen'); render();
    }
  });
  conn.on('data', handleData);
  conn.on('close', () => setStatus('انقطع الاتصال'));
}
function handleData(data) {
  if (data.type === 'start') {
    gameState = data.state; animations = []; pulses = []; confetti = []; arcs = [];
    showScreen('gameScreen'); render();
  } else if (data.type === 'move') {
    if (myRole !== 'host') return;
    const result = applyMove(gameState, 'guest', data.x, data.y);
    if (result.ok) {
      const lastMove = { x: data.x, y: data.y, player: 'guest', attracted: result.attracted, won: result.won };
      conn.send({ type: 'state', state: gameState, lastMove });
      playMoveEffects(result);
    } else {
      conn.send({ type: 'state', state: gameState });
    }
  } else if (data.type === 'state') {
    if (myRole !== 'guest') return;
    gameState = data.state;
    if (data.lastMove) playMoveEffects({ placed: data.lastMove, attracted: data.lastMove.attracted, won: data.lastMove.won });
    else render();
  } else if (data.type === 'requestNewGame') {
    if (myRole !== 'host') return;
    gameState = newGameState(); animations = []; pulses = []; confetti = []; arcs = [];
    conn.send({ type: 'start', state: gameState }); render();
  }
}
function playMoveEffects(result) {
  const now = performance.now();
  if (result.attracted && result.attracted.length > 0) {
    pulses.push({ x: result.placed.x, y: result.placed.y, start: now, duration: 700, color: result.placed.owner });
    for (const p of result.attracted) {
      arcs.push({ x1: p.x, y1: p.y, x2: result.placed.x, y2: result.placed.y, start: now, duration: 360, owner: p.owner });
      animations.push({ x: p.x, y: p.y, toX: result.placed.x, toY: result.placed.y, owner: p.owner, start: now, duration: 500 });
    }
    sfxAttract();
  } else {
    pulses.push({ x: result.placed.x, y: result.placed.y, start: now, duration: 500, color: result.placed.owner });
    sfxPlace();
  }
  if (result.won) {
    const isMe = result.placed.owner === myRole;
    addConfetti();
    screenShake = 12;
    isMe ? sfxWin() : sfxLose();
  }
  startRenderLoop();
}
function addConfetti() {
  const colors = ['#ff4466', '#ffaa44', '#44ff88', '#4488ff', '#ff44ff', '#ffdd44'];
  for (let i = 0; i < 80; i++) {
    confetti.push({
      x: BOARD/2 + (Math.random()-0.5)*40, y: BOARD/2,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 3 + Math.random() * 6, rot: Math.random() * Math.PI,
      vrot: (Math.random() - 0.5) * 0.3, start: performance.now(), duration: 2200
    });
  }
}
function startRenderLoop() {
  if (renderLoopActive) return;
  renderLoopActive = true;
  lastFrame = performance.now();
  function loop() {
    const now = performance.now();
    const dt = Math.min(50, now - lastFrame) / 16.67;
    lastFrame = now;
    animations = animations.filter(a => now - a.start < a.duration);
    pulses = pulses.filter(p => now - p.start < p.duration);
    confetti = confetti.filter(c => now - c.start < c.duration);
    arcs = arcs.filter(a => now - a.start < a.duration);
    for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 0.45 * dt; c.rot += c.vrot * dt; }
    if (screenShake > 0) screenShake *= 0.88;
    if (screenShake < 0.3) screenShake = 0;
    render();
    if (animations.length > 0 || pulses.length > 0 || confetti.length > 0 || arcs.length > 0 || screenShake > 0) requestAnimationFrame(loop);
    else renderLoopActive = false;
  }
  requestAnimationFrame(loop);
}

function getBoardCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width * BOARD, y: (e.clientY - rect.top) / rect.height * BOARD };
}
function onPointerMove(e) {
  if (!gameState || gameState.winner || gameState.currentTurn !== myRole) {
    if (hoverPos) { hoverPos = null; render(); }
    return;
  }
  if (e.pointerType === 'touch') return;
  hoverPos = getBoardCoords(e);
  render();
}
function onPointerDown(e) {
  if (!gameState || gameState.winner || gameState.currentTurn !== myRole) return;
  const pos = getBoardCoords(e);
  const check = checkPlacement(gameState, pos.x, pos.y);
  if (!check.ok) {
    sfxError();
    pulses.push({ x: pos.x, y: pos.y, start: performance.now(), duration: 360, color: 'error' });
    startRenderLoop();
    return;
  }
  attemptMove(pos.x, pos.y);
}
function attemptMove(x, y) {
  hoverPos = null;
  if (myRole === 'host') {
    const result = applyMove(gameState, 'host', x, y);
    if (result.ok) {
      const lastMove = { x, y, player: 'host', attracted: result.attracted, won: result.won };
      conn.send({ type: 'state', state: gameState, lastMove });
      playMoveEffects(result);
    }
  } else {
    conn.send({ type: 'move', x, y });
  }
}
function requestNewGame() {
  if (myRole === 'host') {
    gameState = newGameState(); animations = []; pulses = []; confetti = []; arcs = []; screenShake = 0;
    conn.send({ type: 'start', state: gameState }); render();
  } else {
    conn.send({ type: 'requestNewGame' });
  }
}
function copyCode() {
  if (!roomCode) return;
  const done = () => { setStatus('✓ تم نسخ الرمز'); setTimeout(() => setStatus(''), 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(done).catch(fallback);
  else fallback();
  function fallback() {
    const el = document.createElement('textarea');
    el.value = roomCode; document.body.appendChild(el);
    el.select(); document.execCommand('copy'); document.body.removeChild(el); done();
  }
}

// ============ رسم الطاولة الخشبية ============
function generateBoardTexture() {
  const c = document.createElement('canvas');
  c.width = BOARD; c.height = BOARD;
  const bx = c.getContext('2d');
  const grad = bx.createLinearGradient(0, 0, BOARD, BOARD);
  grad.addColorStop(0, '#3d2c1a'); grad.addColorStop(0.5, '#2a1f14'); grad.addColorStop(1, '#1a1208');
  bx.fillStyle = grad; bx.fillRect(0, 0, BOARD, BOARD);
  for (let i = 0; i < 200; i++) {
    const y = Math.random() * BOARD;
    const w = 60 + Math.random() * 200;
    const x = Math.random() * BOARD - w/2;
    bx.beginPath(); bx.moveTo(x, y);
    for (let t = 0; t < w; t += 15) {
      bx.lineTo(x + t, y + Math.sin(t * 0.04 + i) * 2.5 + Math.random() * 1.5);
    }
    const shade = Math.random() > 0.5 ? 'rgba(15,8,3,' : 'rgba(80,50,20,';
    bx.strokeStyle = shade + (0.06 + Math.random()*0.12) + ')';
    bx.lineWidth = 0.8 + Math.random() * 1.5;
    bx.stroke();
  }
  for (let k = 0; k < 4; k++) {
    const kx = 80 + Math.random() * (BOARD - 160);
    const ky = 80 + Math.random() * (BOARD - 160);
    for (let r = 3; r < 35; r += 2.5) {
      bx.beginPath();
      bx.ellipse(kx, ky, r, r * 0.65, Math.random() * 0.5, 0, Math.PI * 2);
      bx.strokeStyle = `rgba(15,8,4,${0.12 - r * 0.002})`;
      bx.lineWidth = 1; bx.stroke();
    }
    bx.beginPath(); bx.arc(kx, ky, 4, 0, Math.PI * 2);
    bx.fillStyle = 'rgba(10,5,2,0.6)'; bx.fill();
  }
  const vg = bx.createRadialGradient(BOARD/2, BOARD/2, BOARD*0.25, BOARD/2, BOARD/2, BOARD*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  bx.fillStyle = vg; bx.fillRect(0, 0, BOARD, BOARD);
  const light = bx.createRadialGradient(BOARD*0.3, BOARD*0.25, 20, BOARD*0.3, BOARD*0.25, BOARD*0.7);
  light.addColorStop(0, 'rgba(255,200,120,0.08)'); light.addColorStop(1, 'rgba(255,200,120,0)');
  bx.fillStyle = light; bx.fillRect(0, 0, BOARD, BOARD);
  return c;
}

function drawBoard() {
  if (!boardTexture) boardTexture = generateBoardTexture();
  ctx.drawImage(boardTexture, 0, 0);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= BOARD; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, BOARD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(BOARD, i); ctx.stroke();
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, BOARD - 10, BOARD - 10);
  ctx.strokeStyle = 'rgba(200,160,100,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(2, 2, BOARD - 4, BOARD - 4);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(9, 9, BOARD - 18, BOARD - 18);
  ctx.restore();
}

// ============ رسم الكرة المغناطيسية السوداء (شكل واقعي) ============
function drawMagnet(x, y, owner, highlight, scale) {
  scale = scale || 1;
  const r = PIECE_R * scale;
  const isHost = owner === 'host';
  
  ctx.save();
  ctx.translate(x, y);

  // 1. الظل الأساسي (Drop Shadow)
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.restore();

  // 2. جسم الكرة (تدرج معدني داكن)
  const sphereGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
  sphereGrad.addColorStop(0, '#666');       // لمعة خفيفة
  sphereGrad.addColorStop(0.3, '#222');     // لون الكرة الأساسي
  sphereGrad.addColorStop(0.8, '#050505');  // الظل الداخلي
  sphereGrad.addColorStop(1, '#000');       // الحافة
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = sphereGrad; ctx.fill();

  // 3. توهج لوني خفيف للتمييز بين اللاعبين (أحمر/أزرق)
  const colorGlow = ctx.createRadialGradient(r*0.2, r*0.2, 0, r*0.2, r*0.2, r*0.9);
  if (isHost) {
    colorGlow.addColorStop(0, 'rgba(255, 50, 80, 0.4)'); 
    colorGlow.addColorStop(1, 'rgba(255, 50, 80, 0)');
  } else {
    colorGlow.addColorStop(0, 'rgba(50, 150, 255, 0.4)'); 
    colorGlow.addColorStop(1, 'rgba(50, 150, 255, 0)');
  }
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = colorGlow; ctx.fill();

  // 4. الانعكاس الأساسي (Specular Highlight) - اللمعة البيضاء الكبيرة
  ctx.beginPath();
  ctx.ellipse(-r*0.35, -r*0.35, r*0.25, r*0.15, -Math.PI/4, 0, Math.PI*2);
  const spec = ctx.createRadialGradient(-r*0.35, -r*0.35, 0, -r*0.35, -r*0.35, r*0.3);
  spec.addColorStop(0, 'rgba(255,255,255,1)');
  spec.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = spec; ctx.fill();

  // 5. انعكاس ثانوي صغير (لزيادة الواقعية)
  ctx.beginPath();
  ctx.arc(r*0.4, -r*0.4, r*0.08, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();

  // 6. حدود بيضاء إذا كانت القطعة محددة
  if (highlight) {
    ctx.beginPath(); ctx.arc(0, 0, r + 2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.restore();
}

function drawElectricArc(x1, y1, x2, y2, alpha, owner) {
  const segments = 10;
  const color = owner === 'host' ? '255,100,120' : '100,180,255';
  const offsets = [];
  for (let i = 0; i <= segments; i++) offsets.push((Math.random() - 0.5) * 14 * Math.sin((i/segments) * Math.PI));
  ctx.save();
  ctx.shadowColor = `rgba(${color},0.9)`;
  ctx.shadowBlur = 12;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath(); ctx.moveTo(x1, y1);
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const perpX = -dy / len, perpY = dx / len;
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      const x = x1 + dx * t + perpX * offsets[i];
      const y = y1 + dy * t + perpY * offsets[i];
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x2, y2);
    if (pass === 0) {
      ctx.strokeStyle = `rgba(${color},${alpha * 0.4})`;
      ctx.lineWidth = 5;
    } else {
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1.8;
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawPreview(x, y) {
  const check = checkPlacement(gameState, x, y);
  const attractList = [];
  for (const p of gameState.pieces) {
    const d = dist({x, y}, p);
    if (d < MAGNET_R) attractList.push({ piece: p, distance: d });
  }
  for (const w of attractList) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(w.piece.x, w.piece.y);
    ctx.strokeStyle = 'rgba(255,100,80,0.5)';
    ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.beginPath(); ctx.arc(x, y, MAGNET_R, 0, Math.PI * 2);
  if (attractList.length > 0) { ctx.fillStyle = 'rgba(255,60,60,0.07)'; ctx.strokeStyle = 'rgba(255,80,80,0.55)'; }
  else { ctx.fillStyle = 'rgba(80,255,120,0.05)'; ctx.strokeStyle = 'rgba(80,255,120,0.4)'; }
  ctx.fill(); ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
  if (check.ok) { ctx.globalAlpha = 0.55; drawMagnet(x, y, myRole, false, 1); ctx.globalAlpha = 1; }
  else {
    ctx.strokeStyle = 'rgba(255,60,60,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x-11, y-11); ctx.lineTo(x+11, y+11);
    ctx.moveTo(x+11, y-11); ctx.lineTo(x-11, y+11); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

function render() {
  if (!ctx) return;
  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
  drawBoard();
  if (gameState) {
    for (const p of gameState.pieces) drawMagnet(p.x, p.y, p.owner, false, 1);
    if (hoverPos && gameState.currentTurn === myRole && !gameState.winner) drawPreview(hoverPos.x, hoverPos.y);
    const now = performance.now();
    for (const a of arcs) {
      const t = (now - a.start) / a.duration;
      drawElectricArc(a.x1, a.y1, a.x2, a.y2, Math.max(0, 1 - t), a.owner);
    }
    for (const a of animations) {
      const t = Math.min(1, (now - a.start) / a.duration);
      const ease = 1 - Math.pow(1 - t, 3);
      const x = a.x + (a.toX - a.x) * ease;
      const y = a.y + (a.toY - a.y) * ease;
      const s = 1 - t * 0.4;
      ctx.globalAlpha = 1 - t * 0.7;
      drawMagnet(x, y, a.owner, false, s);
      ctx.globalAlpha = 1;
    }
    for (const pu of pulses) {
      const t = (now - pu.start) / pu.duration;
      const r = MAGNET_R * t * 1.3;
      const alpha = Math.max(0, 1 - t) * 0.8;
      ctx.beginPath(); ctx.arc(pu.x, pu.y, r, 0, Math.PI * 2);
      if (pu.color === 'error') ctx.strokeStyle = `rgba(255,80,80,${alpha})`;
      else if (pu.color === 'host') ctx.strokeStyle = `rgba(255,100,120,${alpha})`;
      else ctx.strokeStyle = `rgba(100,180,255,${alpha})`;
      ctx.lineWidth = 3; ctx.stroke();
    }
    for (const c of confetti) {
      const t = (now - c.start) / c.duration;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.5);
      ctx.restore();
    }
    if (gameState.winner) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, BOARD/2 - 55, BOARD, 110);
      const isWinner = gameState.winner === myRole;
      ctx.fillStyle = isWinner ? '#44ff88' : '#ff6688';
      ctx.font = '900 52px "Arial Black", Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = isWinner ? 'rgba(68,255,136,0.8)' : 'rgba(255,102,136,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillText(isWinner ? '🏆 فزت!' : '😢 خسرت', BOARD/2, BOARD/2);
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
  updateHud();
}

function updateHud() {
  if (!gameState) return;
  const myHand = myRole === 'host' ? gameState.hostHand : gameState.guestHand;
  const oppHand = myRole === 'host' ? gameState.guestHand : gameState.hostHand;
  const myColor = myRole === 'host' ? 'red' : 'blue';
  const oppColor = myRole === 'host' ? 'blue' : 'red';
  const topEl = document.getElementById('topHud');
  const bottomEl = document.getElementById('bottomHud');
  const newBtn = document.getElementById('newGameBtn');
  topEl.className = 'hud hud-top'; bottomEl.className = 'hud hud-bottom';
  const oppTurn = !gameState.winner && gameState.currentTurn !== myRole;
  topEl.innerHTML = `<div class="side"><span class="magnet-icon ${oppColor}"></span><span>صديقك</span></div>
    <div class="side"><span class="count">${oppHand}</span>${oppTurn ? '<span class="turn-indicator">🎯 يلعب</span>' : ''}</div>`;
  let myStatus = '';
  if (gameState.winner) {
    if (gameState.winner === myRole) { myStatus = '<span class="win-badge">🏆 فزت!</span>'; bottomEl.classList.add('win'); }
    else { myStatus = '<span>😢 خسرت</span>'; bottomEl.classList.add('lose'); }
    newBtn.style.display = 'block';
  } else {
    if (gameState.currentTurn === myRole) { myStatus = '<span class="turn-indicator">🎯 دورك</span>'; bottomEl.classList.add('myTurn'); }
    else { myStatus = '<span class="turn-indicator" style="color:rgba(200,220,255,0.5)">انتظر...</span>'; }
    newBtn.style.display = 'none';
  }
  bottomEl.innerHTML = `<div class="side"><span class="magnet-icon ${myColor}"></span><span>أنت</span></div>
    <div class="side"><span class="count">${myHand}</span>${myStatus}</div>`;
}
</script>
